<!doctype html>
<html lang="en" ng-app="ShoppingListCheckOff">
  <head>
    <title>Shopping List Check Off</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles/bootstrap.min.css" />
    <style>
      .emptyMessage {
        font-weight: bold;
        color: red;
        font-size: 1.2em;
      }
      .textbox {
        width: 100px;
      }
      li {
        margin-bottom: 7px;
        font-size: 1.2em;
      }
      li > button {
        margin-left: 6px;
      }
      button > span {
        color: green;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Shopping List Check Off</h1>

      <div class="row">
        <!-- To Buy List -->
        <div class="col-md-6" ng-controller="ToBuyController as toByList">
          <h2>To Buy:</h2>
          <ul>
            <li ng-repeat="item in toByList.items">
              Buy {{item.quantity}} {{item.name}}
              <input
                type="number"
                ng-model="item.quantity"
                min="0"
                step="1"
                placeholder="quantity"
                class="textbox"
              />
              <button ng-click="toByList.buy($index);" class="btn btn-default">
                <span class="glyphicon glyphicon-ok"></span> Bought
              </button>
            </li>
          </ul>
          <div ng-if="toByList.items.length === 0" class="emptyMessage">
            Everything is bought!
          </div>
        </div>

        <!-- Already Bought List -->
        <div
          class="col-md-6"
          ng-controller="AlreadyBoughtController as boughtList"
        >
          <h2>Already Bought:</h2>
          <ul>
            <li ng-repeat="item in boughtList.items">
              Bought {{item.quantity}} of {{item.name}} for total price of {{
              item.quantity * item.pricePerItem | customCurrency }}
            </li>
          </ul>
          <div ng-if="boughtList.items.length === 0" class="emptyMessage">
            Nothing bought yet.
          </div>
        </div>
      </div>
    </div>
    <script src="angular.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
