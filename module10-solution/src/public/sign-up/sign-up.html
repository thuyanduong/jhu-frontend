<div class="container sign-up-form">
  <h1 class="form-title">Sign Up for our Newsletter</h1>
  <form name="signupForm" novalidate>
    <label for="firstName">First Name *</label>
    <input
      name="firstName"
      type="text"
      placeholder="First Name"
      ng-model="signupCtrl.firstName"
      required
      class="form-control"
    />
    <span
      class="text-warning"
      ng-if="signupForm.firstName.$error.required && signupForm.firstName.$touched"
    >
      Please enter your first name.
    </span>
    <br />

    <label for="lastName">Last Name *</label>
    <input
      name="lastName"
      type="text"
      placeholder="Last Name"
      ng-model="signupCtrl.lastName"
      required
      class="form-control"
    />
    <span
      class="text-warning"
      ng-if="signupForm.lastName.$error.required && signupForm.lastName.$touched"
    >
      Please enter your last name.
    </span>
    <br />

    <label for="emailAddress">Email *</label>
    <input
      name="emailAddress"
      type="email"
      placeholder="Email"
      ng-model="signupCtrl.emailAddress"
      required
      class="form-control"
    />
    <span
      class="text-warning"
      ng-if="(signupForm.emailAddress.$error.required || signupForm.emailAddress.$invalid) && signupForm.emailAddress.$touched"
    >
      Please enter a valid email address.
    </span>
    <br />

    <label for="phoneNumber">Phone Number</label>
    <input
      name="phoneNumber"
      type="text"
      placeholder="###-###-####"
      pattern="(\d{3})-(\d{3})-(\d{4})"
      ng-model="signupCtrl.phoneNumber"
      class="form-control"
    />
    <span
      class="text-warning"
      ng-if="signupForm.phoneNumber.$invalid && signupForm.phoneNumber.$touched"
    >
      Please enter a phone number in the correct format.
    </span>
    <br />

    <label for="favoriteDish">Favorite Dish Menu Number *</label>
    <input
      name="favoriteDish"
      type="text"
      placeholder="SP1"
      ng-model="signupCtrl.favoriteDish"
      required
      class="form-control"
    />
    <span
      class="text-warning"
      ng-if="signupForm.favoriteDish.$touched && signupForm.favoriteDish.$error.required"
    >
      Please enter a favorite menu number.
    </span>
    <span
      class="text-warning"
      ng-if="signupForm.favoriteDish.$touched &&
         signupCtrl.favoriteDish &&
         signupCtrl.allShortNames.indexOf((signupCtrl.favoriteDish | uppercase)) === -1"
    >
      No such menu number exists.
    </span>
    <br />
    <br />

    <div class="text-center">
      <button
        ng-disabled="signupForm.$invalid || signupCtrl.allShortNames.indexOf((signupCtrl.favoriteDish | uppercase)) === -1"
        ng-click="signupCtrl.submit()"
        class="btn btn-default"
      >
        Submit
      </button>
    </div>
  </form>

  <br />
  <p class="text-center" ng-if="signupCtrl.submitted">
    Your information has been saved!
  </p>
</div>
